<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textile 2K23 - Notes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header-container"></header>

    <main>
        <section id="notes-section">
            <h2>Notes</h2>
            <div id="semester-selection-notes">
                <label for="semester-notes">Semester:</label>
                <select id="semester-notes">
                    <option value="">Select Semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>
            </div>

            <div id="class-selection-notes">
                <label for="class-notes">Class:</label>
                <select id="class-notes">
                    <option value="">Select Class</option>
                </select>
                <label for="new-class-notes">Add new class:</label>
                <input type="text" id="new-class-notes" placeholder="Enter new class">
                <button id="add-class-notes">Add Class</button>
            </div>

            <div id="teacher-selection-notes">
                <label for="teacher-notes">Teacher:</label>
                <select id="teacher-notes">
                    <option value="">Select Teacher</option>
                </select>
                <label for="new-teacher-notes">Add new teacher:</label>
                <input type="text" id="new-teacher-notes" placeholder="Enter new teacher">
                <button id="add-teacher-notes">Add Teacher</button>
            </div>

            <div id="chapter-selection-notes">
                <label for="chapter-notes">Chapter:</label>
                <select id="chapter-notes">
                    <option value="">Select Chapter</option>
                </select>
                <label for="new-chapter-notes">Add new chapter:</label>
                <input type="text" id="new-chapter-notes" placeholder="Enter new chapter">
                <button id="add-chapter-notes">Add Chapter</button>
            </div>

            <div id="student-selection-notes">
                <label for="student-name-notes">Student Name:</label>
                <select id="student-name-notes">
                    <option value="">Select Student</option>
                </select>
                <label for="new-student-name-notes">Add new student:</label>
                <input type="text" id="new-student-name-notes" placeholder="Enter student name">
                <button id="add-student-name-notes">Add Student</button>
            </div>

            <div id="roll-selection-notes">
                <label for="roll-number-notes">Roll Number:</label>
                <select id="roll-number-notes">
                    <option value="">Select Roll Number</option>
                </select>
                <label for="new-roll-number-notes">Add new roll number:</label>
                <input type="text" id="new-roll-number-notes" placeholder="Enter roll number">
                <button id="add-roll-number-notes">Add Roll Number</button>
            </div>

            <div id="notes-upload">
                <label for="notes-content">Notes Content (Text or URL):</label>
                <textarea id="notes-content" placeholder="Enter notes content or URL"></textarea>
                <button id="upload-notes">Upload Notes</button>
            </div>

            <div id="notes-list" class="notes-list"></div>
            <div id="notes-viewer-container">
                <div id="notes-viewer" style="display: none;"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Textile 2K23. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
