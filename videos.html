<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textile 2K23 - Videos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header-container"></header>

    <main>
        <section id="video-section">
            <h2>Video Integration (<a href="https://www.youtube.com/" target="_blank">YouTube</a>)</h2>
            <div id="semester-selection-video">
                <label for="semester-video">Semester:</label>
                <select id="semester-video">
                    <option value="">Select Semester</option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>
            </div>

            <div id="class-selection-video">
                <label for="class-video">Class:</label>
                <select id="class-video">
                    <option value="">Select Class</option>
                </select>
                <label for="new-class-video">Add new class:</label>
                <input type="text" id="new-class-video" placeholder="Enter new class">
                <button id="add-class-video">Add Class</button>
            </div>

            <div id="teacher-selection-video">
                <label for="teacher-video">Teacher:</label>
                <select id="teacher-video">
                    <option value="">Select Teacher</option>
                </select>
                <label for="new-teacher-video">Add new teacher:</label>
                <input type="text" id="new-teacher-video" placeholder="Enter new teacher">
                <button id="add-teacher-video">Add Teacher</button>
            </div>

            <div id="chapter-selection-video">
                <label for="chapter-video">Chapter:</label>
                <select id="chapter-video">
                    <option value="">Select Chapter</option>
                </select>
                <label for="new-chapter-video">Add new chapter:</label>
                <input type="text" id="new-chapter-video" placeholder="Enter new chapter">
                <button id="add-chapter-video">Add Chapter</button>
            </div>

            <div id="video-upload">
                <label for="video-url">YouTube Video URL:</label>
                <input type="url" id="video-url" placeholder="Enter YouTube Video URL (e.g., https://youtu.be/VIDEO_ID)">
                <button id="add-video-button">Add Video</button>
            </div>

            <div id="video-list" class="video-list"></div>
            <div id="video-player-container">
                <iframe id="video-player" style="display: none;" frameborder="0" allowfullscreen></iframe>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2025 Textile 2K23. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
